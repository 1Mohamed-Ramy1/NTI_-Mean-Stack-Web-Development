<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XHR CRUD Task</title>
</head>

<body>
  <h1>Posts CRUD with XMLHttpRequest</h1>

  <section>
    <h2>GET - Display Posts</h2>
    <button id="getButton">Get Posts</button>
    <div id="postsContainer"></div>
  </section>

  <hr>

  <section>
    <h2>POST - Add Post</h2>
    <form id="postForm">
      <label for="postTitle">Title</label>
      <input id="postTitle" type="text" required>
      <br>
      <label for="postBody">Body</label>
      <input id="postBody" type="text" required>
      <br>
      <button type="submit">Add Post</button>
    </form>
  </section>

  <hr>

  <section>
    <h2>PUT - Update Post</h2>
    <form id="putForm">
      <label for="putId">Post ID</label>
      <input id="putId" type="number" min="1" value="1" required>
      <br>
      <label for="putTitle">New Title</label>
      <input id="putTitle" type="text" required>
      <br>
      <label for="putBody">New Body</label>
      <input id="putBody" type="text" required>
      <br>
      <button type="submit">Update Post</button>
    </form>
  </section>

  <hr>

  <section>
    <h2>DELETE - Delete Post</h2>
    <form id="deleteForm">
      <label for="deleteId">Post ID</label>
      <input id="deleteId" type="number" min="1" value="1" required>
      <button type="submit">Delete Post</button>
    </form>
  </section>

  <p id="message"></p>
  <div id="result"></div>

  <script type="module" src="./main.js"></script>
</body>

</html>
