<body>
    <div class="container">
        <h1>Task 5: Function Declaration vs Function Expression Hoisting</h1>
        
        <div class="description">
            <strong>Question:</strong> Predict what happens in each case, then explain the difference:
            <pre>// Case 1
sayHi();
function sayHi() {
    console.log("Hi");
}

// Case 2
sayBye();
var sayBye = function () {
    console.log("Bye");
};</pre>
        </div>

        <div id="output"></div>
    </div>

</body>
