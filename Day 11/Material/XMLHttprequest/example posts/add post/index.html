<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Add Post with XHR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 CSS (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="h3 mb-3">Add New Post</h1>

      <!-- Form -->
      <form id="postForm" class="card p-3 shadow-sm mb-4">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" id="titleInput" class="form-control" placeholder="Enter post title" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Body</label>
          <textarea id="bodyInput" class="form-control" rows="3" placeholder="Enter post body" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Add Post</button>
      </form>

      <!-- Result -->
      <div id="resultContainer">
        
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
